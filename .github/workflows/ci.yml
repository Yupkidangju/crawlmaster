name: build-test-package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build libx11-dev libxrandr-dev libxcursor-dev libxi-dev libudev-dev libgl1-mesa-dev libfreetype6-dev xvfb

      - name: Configure Release
        run: cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        run: cmake --build build/ci --parallel 2

      - name: Run CTest
        run: ctest --test-dir build/ci --output-on-failure --no-tests=error

      - name: Install tree
        run: cmake --install build/ci --prefix build/install

      - name: Create package and checksum
        run: cpack --config build/ci/CPackConfig.cmake

      - name: Linux packaged resource and arbitrary-CWD smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          package=$(find "$GITHUB_WORKSPACE/build/ci/package" -maxdepth 1 -name 'Crawlmaster-*.tar.gz' -print -quit)
          (cd "$(dirname "$package")" && sha256sum -c "$(basename "$package").sha256")
          mkdir -p "$RUNNER_TEMP/crawlmaster-package"
          cd "$RUNNER_TEMP/crawlmaster-package"
          cmake -E tar xzf "$package"
          package_root=$(find "$RUNNER_TEMP/crawlmaster-package" -mindepth 1 -maxdepth 1 -type d -name 'Crawlmaster-*' -print -quit)
          cd /tmp
          "$package_root/bin/Crawlmaster" --verify-resources
          set +e
          timeout 5s xvfb-run -a "$package_root/bin/Crawlmaster"
          status=$?
          test "$status" -eq 124

      - name: Windows packaged resource and arbitrary-CWD smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Get-ChildItem "$env:GITHUB_WORKSPACE/build/ci/package/Crawlmaster-*.zip" | Select-Object -First 1
          $expected = (Get-Content "$($archive.FullName).sha256").Split()[0]
          $actual = (Get-FileHash $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Package SHA-256 mismatch" }
          $extract = "$env:RUNNER_TEMP/crawlmaster-package"
          Expand-Archive $archive.FullName -DestinationPath $extract
          $root = Get-ChildItem $extract -Directory | Select-Object -First 1
          Push-Location $env:RUNNER_TEMP
          & "$($root.FullName)/bin/Crawlmaster.exe" --verify-resources
          if ($LASTEXITCODE -ne 0) { throw "Packaged resource verification failed" }
          $process = Start-Process "$($root.FullName)/bin/Crawlmaster.exe" -WorkingDirectory $env:RUNNER_TEMP -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) { throw "Crawlmaster exited during startup smoke with $($process.ExitCode)" }
          Stop-Process -Id $process.Id
          Pop-Location

      - name: Generate complete artifact SPDX SBOM
        run: python scripts/generate_release_sbom.py --install-root build/install --platform "${{ runner.os }}" --output "build/ci/package/Crawlmaster-${{ runner.os }}-artifact.spdx.json"

      - name: Generate independent Syft SPDX inventory
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: build/install
          format: spdx-json
          output-file: build/ci/package/Crawlmaster-${{ runner.os }}-syft.spdx.json
          artifact-name: Crawlmaster-${{ runner.os }}-syft.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Scan artifact SBOM for known vulnerabilities
        uses: anchore/scan-action@0d444ed77d83ee2ba7f5ced0d90d640a1281d762 # v7.3.0
        with:
          sbom: build/ci/package/Crawlmaster-${{ runner.os }}-artifact.spdx.json
          fail-build: true
          severity-cutoff: high
          output-format: json
          output-file: build/ci/package/Crawlmaster-${{ runner.os }}-grype.json

      - name: Attest package build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: |
            build/ci/package/Crawlmaster-*.tar.gz
            build/ci/package/Crawlmaster-*.zip

      - name: Attest package SBOM
        if: github.event_name != 'pull_request'
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: |
            build/ci/package/Crawlmaster-*.tar.gz
            build/ci/package/Crawlmaster-*.zip
          sbom-path: build/ci/package/Crawlmaster-${{ runner.os }}-artifact.spdx.json

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Crawlmaster-${{ runner.os }}
          path: build/ci/package/Crawlmaster-*
          if-no-files-found: error
