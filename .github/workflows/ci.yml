name: build-test-package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build libx11-dev libxrandr-dev libxcursor-dev libxi-dev libudev-dev libgl1-mesa-dev libfreetype6-dev xvfb

      - name: Configure Release on Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Configure Release with MSVC
        if: runner.os == 'Windows'
        run: cmake -S . -B build/ci -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        run: cmake --build build/ci --config Release --parallel 2

      - name: Run CTest
        run: ctest --test-dir build/ci -C Release --output-on-failure --no-tests=error

      - name: Install tree
        run: cmake --install build/ci --config Release --prefix build/install

      - name: Create package and checksum
        run: cpack --config build/ci/CPackConfig.cmake -C Release

      - name: Linux packaged resource and arbitrary-CWD smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          package=$(find "$GITHUB_WORKSPACE/build/ci/package" -maxdepth 1 -name 'Crawlmaster-*.tar.gz' -print -quit)
          (cd "$(dirname "$package")" && sha256sum -c "$(basename "$package").sha256")
          mkdir -p "$RUNNER_TEMP/crawlmaster-package"
          cd "$RUNNER_TEMP/crawlmaster-package"
          cmake -E tar xzf "$package"
          package_root=$(find "$RUNNER_TEMP/crawlmaster-package" -mindepth 1 -maxdepth 1 -type d -name 'Crawlmaster-*' -print -quit)
          cd /tmp
          "$package_root/bin/Crawlmaster" --verify-resources
          set +e
          CRAWLMASTER_HEADLESS=1 xvfb-run -a timeout -k 2s 5s "$package_root/bin/Crawlmaster"
          status=$?
          test "$status" -eq 124

      - name: Windows packaged resource and arbitrary-CWD smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Get-ChildItem "$env:GITHUB_WORKSPACE/build/ci/package/Crawlmaster-*.zip" | Select-Object -First 1
          $expected = (Get-Content "$($archive.FullName).sha256").Split()[0]
          $actual = (Get-FileHash $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Package SHA-256 mismatch" }
          $extract = "$env:RUNNER_TEMP/crawlmaster-package"
          Expand-Archive $archive.FullName -DestinationPath $extract
          $root = Get-ChildItem $extract -Directory | Select-Object -First 1
          Push-Location $env:RUNNER_TEMP
          & "$($root.FullName)/bin/Crawlmaster.exe" --verify-resources
          if ($LASTEXITCODE -ne 0) { throw "Packaged resource verification failed" }
          $process = Start-Process "$($root.FullName)/bin/Crawlmaster.exe" -WorkingDirectory $env:RUNNER_TEMP -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) { throw "Crawlmaster exited during startup smoke with $($process.ExitCode)" }
          Stop-Process -Id $process.Id
          Pop-Location

      - name: Generate complete artifact SPDX SBOM on Linux
        if: runner.os == 'Linux'
        run: python scripts/generate_release_sbom.py --install-root build/install --platform Linux --output build/ci/package/Crawlmaster-Linux-artifact.spdx.json

      - name: Generate complete artifact SPDX SBOM on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          python scripts\generate_release_sbom.py --install-root build\install --platform Windows --output build\ci\package\Crawlmaster-Windows-artifact.spdx.json

      - name: Generate independent Syft SPDX inventory
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: build/install
          format: spdx-json
          output-file: build/ci/package/Crawlmaster-${{ runner.os }}-syft.spdx.json
          artifact-name: Crawlmaster-${{ runner.os }}-syft.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Scan artifact SBOM for known vulnerabilities
        uses: anchore/scan-action@0d444ed77d83ee2ba7f5ced0d90d640a1281d762 # v7.3.0
        with:
          sbom: build/ci/package/Crawlmaster-${{ runner.os }}-artifact.spdx.json
          fail-build: true
          severity-cutoff: high
          output-format: json
          output-file: build/ci/package/Crawlmaster-${{ runner.os }}-grype.json

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Crawlmaster-${{ runner.os }}
          path: build/ci/package/Crawlmaster-*
          if-no-files-found: error

      - name: Attest package build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: |
            build/ci/package/Crawlmaster-*.tar.gz
            build/ci/package/Crawlmaster-*.zip

      - name: Attest package SBOM
        if: github.event_name != 'pull_request'
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: |
            build/ci/package/Crawlmaster-*.tar.gz
            build/ci/package/Crawlmaster-*.zip
          sbom-path: build/ci/package/Crawlmaster-${{ runner.os }}-artifact.spdx.json

  publish-release:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download verified Linux & Windows release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/linux dist/windows
          gh run download "${{ github.run_id }}" --name Crawlmaster-Linux --dir dist/linux
          gh run download "${{ github.run_id }}" --name Crawlmaster-Windows --dir dist/windows
          ls -lh dist/linux dist/windows

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > release_notes.md <<'EOF'
          ## Crawlmaster ${TAG} — AAA Dark Fantasy 3D Dungeon Crawler RPG

          ### Highlights
          - **Textured 3D First-Person Dungeon Engine**: OpenGL/GLSL normal-mapped lighting, flickering torchlights, biome fog, bloom/vignette post-processing, 60fps smooth camera interpolation, plus automatic GL 1.1 software-textured 3D fallback.
          - **5-Floor Persistent Campaign & Biomes**: Sunken Catacombs, Drowned Cistern, Cursed Ossuary, Obsidian Foundry, and Wyrm's Sanctum with chests, traps, shortcut levers, secret walls, sanctuaries, and lore plaques.
          - **Tactical Turn-Based Combat**: Front/Back rows, 9 elements, Stagger/Break gauge, Enemy Intent Telegraphing, Guard, 24 skills, 43 items with `+0..+5` Blacksmith Forge & Affix Reforging, Lv 1–10 progression, 8 Lv3+ Specializations, 4-node Talent Trees, Bestiary Codex (24 monsters + 2-phase Elder Wyrm boss), and 8 canonical quests.
          - **Full Audio Engine (`miniaudio` 0.11.26)**: 5 BGM tracks, 5 biome ambient loops, 24 SFX, and full volume/mute controls.
          - **Widescreen 16:9 Mouse + Keyboard UI**: 1280×720 virtual canvas (resizable + F11 fullscreen), 5 languages (`ko`, `en`, `ja`, `zh_tw`, `zh_cn`), text scale (75–200%), high-contrast mode, Save Schema v5 (legacy v1–v4 quarantine), and Config Schema v3.

          ### Verification & Supply Chain
          - Built and verified via CTest (15/15 targets), arbitrary-CWD smoke, SHA-256 checksums, SPDX 2.3 SBOM, Syft inventory, Grype high-severity gate, and GitHub build/SBOM attestations on both Linux (`ubuntu-24.04`) and Windows (`windows-2022`).
          EOF
          sed -i "s/\${TAG}/${TAG}/g" release_notes.md
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --title "Crawlmaster ${TAG}" --notes-file release_notes.md
            gh release upload "${TAG}" dist/linux/* dist/windows/* --clobber
          else
            gh release create "${TAG}" dist/linux/* dist/windows/* \
              --title "Crawlmaster ${TAG}" \
              --notes-file release_notes.md
          fi
